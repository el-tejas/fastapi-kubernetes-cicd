name: Deploy to Minikube

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, minikube]
    environment: minikube
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Confirm Minikube is available
        run: minikube status

      - name: Build image in Minikube
        run: minikube image build -t fastapi-kubernetes-cicd:local .

      - name: Apply Kubernetes manifests
        run: kubectl apply -f k8s/

      - name: Wait for deployment
        run: kubectl rollout status deployment/fastapi-api --timeout=120s
